<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <title>Validador de Formularios Avanzado</title>
  </head>
  <body>
    <div class="validador-formularios-container">
      <div class="container-formulario">
        <h1>Registro de Usuario</h1>
        <form action="#" method="post" id="formulario" class="formulario">
          <label for="name">Nombre:</label>
          <input
            class="input-formulario"
            type="text"
            id="name"
            name="name"
            required
          /><br />
          <span id="error-name" class="error-message"></span>
          <br />

          <label for="email">Email:</label>
          <input
            class="input-formulario"
            type="email"
            id="email"
            name="email"
            required
          /><br />
          <span id="error-email" class="error-message"></span>
          <br />

          <label for="password">Contraseña:</label>
          <input
            class="input-formulario"
            type="password"
            id="password"
            name="password"
            required
          /><br />
          <span id="error-password" class="error-message"></span>
          <br />

          <input
            type="submit"
            value="Registrar"
            id="buttonSubmit"
            class="boton-formulario"
          />
        </form>
      </div>
      <div class="aprendido">
        <div class="navigationBar">
          <button
            class="navigationButtons"
            onclick="location.href = '../Conversor/index.html'"
          >
            <i class="fas fa-arrow-left"></i>
          </button>

          <button
            class="navigationButtons"
            onclick="location.href = '../index.html'"
          >
            <i class="fas fa-home"></i>
          </button>

          <button
            class="navigationButtons"
            onclick="location.href = '../Snake/index.html'"
          >
            <i class="fas fa-arrow-right"></i>
          </button>
        </div>
        <h2>Aprendido</h2>
        <p>
          Lo que aprendi mas que nada fue todo lo de regex, validaciones de
          formularios y manejo de errores.
        </p>
        <ul>
          <li class="aprendido-item">Validacion de campos de texto</li>
          <li class="aprendido-item">Validacion de contraseñas</li>
          <li class="aprendido-item">El evento blur</li>
          <li class="aprendido-item">El evento submit</li>
          <li class="aprendido-item">Expresiones regulares (regex)</li>
        </ul>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
