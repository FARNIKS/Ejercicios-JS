<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cronometro-Pomodoro</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <div class="pomodoro">
        <div class="circle">
          <div id="stopwatch" class="stopwatch">00.00</div>
          <div class="buttons">
            <div class="stop" onclick="stop()"></div>
            <div id="play-pause" class="paused" onclick="playPause()"></div>
          </div>
        </div>
        <div id="seconds-sphere" class="seconds-sphere"></div>
      </div>

      <div class="aprendizaje"></div>
    </main>
  </body>
</html>
