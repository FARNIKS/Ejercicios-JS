<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cronometro</title>
    <link rel="stylesheet" href="styles.css" />
     <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <div class="container-cronometro">
        <div class="cronometro">
          <h1>Cronometro</h1>
          <div class="circle">
            <div id="stopwatch" class="stopwatch">00.00</div>
            <div class="buttons">
              <div class="stop" onclick="stop()"></div>
              <div id="play-pause" class="paused" onclick="playPause()"></div>
            </div>
            <div id="seconds-sphere" class="seconds-sphere"></div>
          </div>
        </div>

        <div class="aprendizaje">
           <div class="navigationBar">
          <button
            class="navigationButtons"
            onclick="location.href = '../Contador/index.html'"
          >
            <i class="fas fa-arrow-left"></i>
          </button>

          <button
            class="navigationButtons"
            onclick="location.href = '../index.html'"
          >
            <i class="fas fa-home"></i>
          </button>

          <button
            class="navigationButtons"
            onclick="location.href = '../Formulario HTML/index.html'"
          >
            <i class="fas fa-arrow-right"></i>
          </button>
        </div>
          <h2>Aprendido</h2>
          <p>Aprendi como manipular el DOM, usar setInterval y clearInterval, y crear animaciones con CSS, entre otras cosas.</p>
          <ul>
            <li>Manipulacion del DOM</li>
            <li>setInterval y clearInterval</li>
            <li>Animaciones con CSS</li>
          
        </div>
      </div>
    </main>
  </body>
</html>
