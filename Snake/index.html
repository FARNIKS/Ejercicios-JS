<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>snake</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="containerSnakeGame">
      <div class="snakeGame">
        <h1>Snake</h1>
        <div class="snakeImage" id="snakeImage">
          <img src="imgs/Snake.png" alt="snake png" />
        </div>
        <div id="board"></div>
        <div class="boardInfo">
          <div>Score: <span id="scoreBoard">0</span></div>
          <button id="start">START</button>
        </div>
      </div>
      <div id="gameOver">GAME OVER</div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
