<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Login Page</title>
  </head>
  <body>
    <form action="#" method="post" class="formuulario">
      <div class="imputs-form">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required />
        <span id="error-username" class="error-message"></span>
      </div>
      <div class="imputs-form">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
        <span id="error-email" class="error-message"></span>
      </div>
      <div class="imputs-form">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required />
        <span id="error-password" class="error-message"></span>
      </div>

      <button type="submit" id="button-submit">Login</button>
    </form>
    <script></script>
  </body>
</html>
