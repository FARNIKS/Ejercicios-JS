<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <title>Contador</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="proyectoconocimiento">
      <div class="contador">
        <h1>CONTADOR</h1>
        <div class="tablero">
          <p class="score">Puntaje: <span id="score">0</span></p>
          <div class="contenedor_contador"></div>
          <span class="display" id="display">0</span>
          <div class="botones">
            <button class="boton disminuir" id="disminuir">Disminuir</button>
            <button class="boton aumentar" id="aumentar">Aumentar</button>
            <button class="boton restablecer" id="restablecer">
              Restablecer
            </button>
          </div>
        </div>
      </div>
      <div class="Conocimiento">
        <div class="navigationBar">
          <button
            class="navigationButtons"
            onclick="
              location.href =
                '../Conceptos Básicos y Fundamentos de Funciones/index.html'
            "
          >
            <i class="fas fa-arrow-left"></i>
          </button>

          <button
            class="navigationButtons"
            onclick="location.href = '../index.html'"
          >
            <i class="fas fa-home"></i>
          </button>

          <button
            class="navigationButtons"
            onclick="location.href = '../Conversor/index.html'"
          >
            <i class="fas fa-arrow-right"></i>
          </button>
        </div>

        <h2>Aprendido</h2>
        <p>
          En este proyecto fue mas de refuerxo con unal ogica simple para poder
          empezar con los proyectos de practica, esto siendo de los mas
          sencillos pero igual dando lo mejor para que se vea bien y tenga una
          buen logica
        </p>
      </div>
    </div>
  </body>
</html>
